name = "glance-reader"
main = "index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Set via wrangler secret (NOT in this file — secrets aren't committed):
#   wrangler secret put SHARED_SECRET
# That value is what you paste into Glance's settings as "Bearer token".

# Cookie env vars are public-but-low-value (only useful WITH the bearer
# token). Set them with `wrangler secret put COOKIES_<HOST>` to keep them
# encrypted, OR put them under [vars] below if you'd rather they live in
# wrangler.toml. The Worker reads any env var matching COOKIES_<HOST>.
#
# Examples (uncomment + customize):
# [vars]
# COOKIES_BWI_RIVALS_COM = "PHPSESSID=xxx; user=yyy; remember=zzz"
# COOKIES_WWW_NYTIMES_COM = "NYT-S=xxx; nyt-a=yyy"
